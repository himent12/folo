<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" width="720" height="660" role="img" aria-labelledby="t d" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Inference speed: folo-n against yolo26n</title>
<desc id="d">Grouped bars. Latency at batch 1 in milliseconds and throughput at batch 16 in images per second, on the GPU and the CPU, for folo-n and yolo26n. GPU forward: 1.14 ms against 4.95 ms. GPU end to end: 1.75 ms against 6.92 ms. CPU forward: 12.7 ms against 22.8 ms. CPU end to end: 13.1 ms against 24.8 ms. GPU forward, f32: 2081 against 1454 images per second. GPU forward, f16: 4159 against 2370 images per second. GPU end to end: 2155 against 615 images per second.</desc>
<rect x="0.5" y="0.5" width="719" height="659" rx="8" fill="#FFFFFF" stroke="#E4E5E5"/>
