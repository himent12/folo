<text x="28" y="138" font-size="13" xml:space="preserve"><tspan font-weight="600" fill="#EDEFF2">Times faster</tspan><tspan font-size="12" fill="#80868F">   latency: YOLO26 over FOLO; throughput: FOLO over YOLO26</tspan></text>
