<text x="28" y="548" font-size="12.5" fill="#646B75">COCO: FOLO trained on COCO alone from random weights, 56 and 64 epochs (folo-n: the second half distilled</text>
<text x="28" y="566" font-size="12.5" fill="#646B75">from folo-s). The YOLO26 numbers are the published ones, from models pretrained on Objects365 and trained for</text>
<text x="28" y="584" font-size="12.5" fill="#646B75">far longer.</text>
<text x="28" y="602" font-size="12.5" fill="#646B75">Fine-tuning: each from its own COCO weights, at its defaults, 100 epochs; the differences are of the unrounded</text>
<text x="28" y="620" font-size="12.5" fill="#646B75">means. &quot;level&quot;: inside the spread of the seeds, or on a set both saturate (signatures). Details:</text>
<text x="28" y="638" font-size="12.5" fill="#646B75">docs/BENCHMARKS.md, Accuracy.</text>
