<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 605" width="720" height="605" role="img" aria-labelledby="t d" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Accuracy: FOLO against YOLO26</title>
<desc id="d">Grouped bars of AP. On COCO val2017, FOLO trained from scratch is behind the published YOLO26 models. Fine-tuned on four small datasets, folo-n and yolo26n are level on three and yolo26n is ahead on one. Nano: 0.317 against 0.409. Small: 0.416 against 0.480. Blood cells (BCCD): 0.607 against 0.626. Brain tumours (MRI): 0.452 against 0.436. Signatures: 0.989 against 0.982. Medical pills: 0.804 against 0.803.</desc>
<rect x="0.5" y="0.5" width="719" height="604" rx="8" fill="#FFFFFF" stroke="#E4E5E5"/>
<text x="28" y="43" font-size="17" font-weight="600" letter-spacing="-0.01em" fill="#0C0E12">Accuracy: FOLO against YOLO26</text>
<text x="28" y="66" font-size="13" fill="#4F5661">COCO AP (pycocotools), one scorer for both sides</text>
<rect x="28" y="84" width="10" height="10" rx="2" fill="#0A8FD6"/>
<text x="44" y="93.5" font-size="12.5" fill="#4F5661">FOLO</text>
<rect x="100" y="84" width="10" height="10" rx="2" fill="#646B75"/>
<text x="116" y="93.5" font-size="12.5" fill="#4F5661">Ultralytics YOLO26</text>
