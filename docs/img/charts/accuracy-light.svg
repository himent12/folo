<text x="28" y="548" font-size="12" fill="#646B75">COCO: FOLO trained from scratch for 56 to 62 epochs. The YOLO26 numbers are the published ones, from models</text>
<text x="28" y="565" font-size="12" fill="#646B75">pretrained on Objects365 and trained for far longer. Fine-tuning: each from its own COCO weights, at its</text>
<text x="28" y="582" font-size="12" fill="#646B75">defaults, 100 epochs. &quot;level&quot;: inside the spread of the seeds. Details: docs/BENCHMARKS.md, Accuracy.</text>
