<path d="M236 436h293.48a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-293.48z" fill="#646B75"/>
<text x="541.48" y="446.4" font-size="13" xml:space="preserve"><tspan font-weight="400" fill="#4F5661">4517</tspan><tspan font-size="12.5" fill="#646B75"> MiB</tspan></text>
<text x="692" y="432" font-size="16" font-weight="600" text-anchor="end" fill="#0C0E12">23%</text>
<text x="692" y="448" font-size="12.5" text-anchor="end" fill="#646B75">less</text>
<text x="28" y="482" font-size="13" font-weight="500" fill="#0C0E12">Training step, AMP</text>
<text x="28" y="499" font-size="12.5" fill="#646B75">peak allocated by live tensors</text>
<path d="M236 472h129.17a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-129.17z" fill="#0A8FD6"/>
<text x="377.17" y="482.4" font-size="13" xml:space="preserve"><tspan font-weight="600" fill="#0C0E12">2022</tspan><tspan font-size="12.5" fill="#646B75"> MiB</tspan></text>
<path d="M236 488h170.26a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-170.26z" fill="#646B75"/>
<text x="418.26" y="498.4" font-size="13" xml:space="preserve"><tspan font-weight="400" fill="#4F5661">2646</tspan><tspan font-size="12.5" fill="#646B75"> MiB</tspan></text>
<text x="692" y="484" font-size="16" font-weight="600" text-anchor="end" fill="#0C0E12">24%</text>
<text x="692" y="500" font-size="12.5" text-anchor="end" fill="#646B75">less</text>
