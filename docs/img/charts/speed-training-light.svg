<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 626" width="720" height="626" role="img" aria-labelledby="t d" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Training speed: folo-n against yolo26n</title>
<desc id="d">Grouped bars. Training throughput at batch 16 in images per second and peak GPU memory allocated by a training step in MiB, for folo-n and yolo26n. Training step, f32: 380 against 202 images per second. Training step, AMP: 594 against 252 images per second. Whole trainer, f32: 388 against 199 images per second. Whole trainer, AMP: 613 against 224 images per second. Training step, f32: 3467 against 4517 MiB. Training step, AMP: 2022 against 2646 MiB.</desc>
<rect x="0.5" y="0.5" width="719" height="625" rx="8" fill="#FFFFFF" stroke="#E4E5E5"/>
<text x="28" y="43" font-size="17" font-weight="600" letter-spacing="-0.01em" fill="#0C0E12">Training speed: folo-n against yolo26n</text>
<text x="28" y="66" font-size="13" fill="#4F5661">RTX 4080 SUPER, Core i7-14700KF, 640×640 input</text>
<rect x="28" y="84" width="10" height="10" rx="2" fill="#0A8FD6"/>
<text x="44" y="93.5" font-size="13" fill="#4F5661">folo-n</text>
<rect x="101.88" y="84" width="10" height="10" rx="2" fill="#646B75"/>
<text x="117.88" y="93.5" font-size="13" fill="#4F5661">yolo26n (Ultralytics 8.4.198), its best configuration for each row</text>
<path d="M28 112.5L692 112.5" stroke="#F1F1F1" stroke-width="1" fill="none"/>
<text x="28" y="138" font-size="13" xml:space="preserve"><tspan font-weight="600" fill="#0C0E12">Throughput at batch 16</tspan><tspan font-size="12.5" fill="#646B75">   images per second, higher is better</tspan></text>
<text x="28" y="172" font-size="13" font-weight="500" fill="#0C0E12">Training step, f32</text>
<text x="28" y="189" font-size="12.5" fill="#646B75">forward, loss, backward, SGD</text>
<path d="M236 162h178.72a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-178.72z" fill="#0A8FD6"/>
<text x="426.72" y="172.4" font-size="13" xml:space="preserve"><tspan font-weight="600" fill="#0C0E12">380</tspan><tspan font-size="12.5" fill="#646B75"> img/s</tspan></text>
<path d="M236 178h93.13a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-93.13z" fill="#646B75"/>
<text x="341.13" y="188.4" font-size="13" xml:space="preserve"><tspan font-weight="400" fill="#4F5661">202</tspan><tspan font-size="12.5" fill="#646B75"> img/s</tspan></text>
<text x="692" y="174" font-size="16" font-weight="600" text-anchor="end" fill="#0C0E12">1.9×</text>
<text x="692" y="190" font-size="12.5" text-anchor="end" fill="#646B75">faster</text>
<text x="28" y="224" font-size="13" font-weight="500" fill="#0C0E12">Training step, AMP</text>
<text x="28" y="241" font-size="12.5" fill="#646B75">the same in mixed precision</text>
<path d="M236 214h281.62a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-281.62z" fill="#0A8FD6"/>
<text x="529.62" y="224.4" font-size="13" xml:space="preserve"><tspan font-weight="600" fill="#0C0E12">594</tspan><tspan font-size="12.5" fill="#646B75"> img/s</tspan></text>
<path d="M236 230h117.17a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-117.17z" fill="#646B75"/>
<text x="365.17" y="240.4" font-size="13" xml:space="preserve"><tspan font-weight="400" fill="#4F5661">252</tspan><tspan font-size="12.5" fill="#646B75"> img/s</tspan></text>
<text x="692" y="226" font-size="16" font-weight="600" text-anchor="end" fill="#0C0E12">2.4×</text>
<text x="692" y="242" font-size="12.5" text-anchor="end" fill="#646B75">faster</text>
<text x="28" y="276" font-size="13" font-weight="500" fill="#0C0E12">Whole trainer, f32</text>
<text x="28" y="293" font-size="12.5" fill="#646B75">data loader, mosaic, 8 workers</text>
<path d="M236 266h182.56a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-182.56z" fill="#0A8FD6"/>
<text x="430.56" y="276.4" font-size="13" xml:space="preserve"><tspan font-weight="600" fill="#0C0E12">388</tspan><tspan font-size="12.5" fill="#646B75"> img/s</tspan></text>
<path d="M236 282h91.69a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-91.69z" fill="#646B75"/>
<text x="339.69" y="292.4" font-size="13" xml:space="preserve"><tspan font-weight="400" fill="#4F5661">199</tspan><tspan font-size="12.5" fill="#646B75"> img/s</tspan></text>
<text x="692" y="278" font-size="16" font-weight="600" text-anchor="end" fill="#0C0E12">1.9×</text>
<text x="692" y="294" font-size="12.5" text-anchor="end" fill="#646B75">faster</text>
<text x="28" y="328" font-size="13" font-weight="500" fill="#0C0E12">Whole trainer, AMP</text>
<text x="28" y="345" font-size="12.5" fill="#646B75">sustained over an epoch</text>
<path d="M236 318h290.75a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-290.75z" fill="#0A8FD6"/>
<text x="538.75" y="328.4" font-size="13" xml:space="preserve"><tspan font-weight="600" fill="#0C0E12">613</tspan><tspan font-size="12.5" fill="#646B75"> img/s</tspan></text>
<path d="M236 334h103.71a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-103.71z" fill="#646B75"/>
<text x="351.71" y="344.4" font-size="13" xml:space="preserve"><tspan font-weight="400" fill="#4F5661">224</tspan><tspan font-size="12.5" fill="#646B75"> img/s</tspan></text>
<text x="692" y="330" font-size="16" font-weight="600" text-anchor="end" fill="#0C0E12">2.7×</text>
<text x="692" y="346" font-size="12.5" text-anchor="end" fill="#646B75">faster</text>
<path d="M235.5 154L235.5 354" stroke="#D8D8D9" stroke-width="1" fill="none"/>
<path d="M28 370.5L692 370.5" stroke="#F1F1F1" stroke-width="1" fill="none"/>
<text x="28" y="396" font-size="13" xml:space="preserve"><tspan font-weight="600" fill="#0C0E12">Peak GPU memory allocated at batch 16</tspan><tspan font-size="12.5" fill="#646B75">   MiB, lower is better</tspan></text>
<text x="28" y="430" font-size="13" font-weight="500" fill="#0C0E12">Training step, f32</text>
<text x="28" y="447" font-size="12.5" fill="#646B75">peak allocated by live tensors</text>
