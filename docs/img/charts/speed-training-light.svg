<path d="M28 524.5L692 524.5" stroke="#F1F1F1" stroke-width="1" fill="none"/>
<text x="28" y="548" font-size="12.5" fill="#646B75">FOLO: medians of runs alternated with its previous build, 2026-11-13 (the rows hill-climb 3 moved; end to end</text>
<text x="28" y="566" font-size="12.5" fill="#646B75">on trained weights) and 2026-11-12 (the rest). YOLO26: its best configuration per row, measured 2026-11-07</text>
<text x="28" y="584" font-size="12.5" fill="#646B75">(whole trainer: the best of 3 runs). Method and noise: docs/BENCHMARKS.md.</text>
<text x="28" y="602" font-size="12.5" fill="#646B75">Memory is what live tensors hold at the peak; both allocators reserve more than that (row 11 there).</text>
