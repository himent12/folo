<text x="28" y="138" font-size="13" xml:space="preserve"><tspan font-weight="600" fill="#0C0E12">Times faster</tspan><tspan font-size="12.5" fill="#646B75">   latency: YOLO26 over FOLO; throughput: FOLO over YOLO26</tspan></text>
