<linearGradient id="g-series0" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0875AF"/><stop offset="100%" stop-color="#0A89CD"/></linearGradient>
<linearGradient id="g-series1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8E5900"/><stop offset="100%" stop-color="#A66800"/></linearGradient>
