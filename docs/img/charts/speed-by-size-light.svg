<text x="28" y="720" font-size="12.5" fill="#646B75">Each bar divides two numbers of the FOLO targets table in docs/BENCHMARKS.md: FOLO's median and the</text>
<text x="28" y="738" font-size="12.5" fill="#646B75">best YOLO26 configuration of that row (measured 2026-11-12 and 2026-11-07).</text>
<text x="28" y="756" font-size="12.5" fill="#646B75">GPU batch-1 latency: both warm up with 25 calls (forward) or 10 (end to end); FOLO's bench then keeps</text>
<text x="28" y="774" font-size="12.5" fill="#646B75">warming until a second has passed, YOLO26's does not.</text>
</svg>
