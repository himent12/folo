<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 743" width="720" height="743" role="img" aria-labelledby="t d" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Speed-up over the YOLO26 model of the same size</title>
<desc id="d">Grouped bars of how many times faster FOLO is than the YOLO26 model of the same size, for the nano and the small models. GPU forward, batch 1, f32: 4.3× for folo-n, 2.2× for folo-s. GPU forward, batch 1, f16, FOLO on tensor cores: 6.6× for folo-n, 5.5× for folo-s. GPU forward, batch 16, f32: 1.4× for folo-n, 1.3× for folo-s. GPU forward, batch 16, f16, FOLO on tensor cores: 1.8× for folo-n, 1.6× for folo-s. GPU end to end, batch 1, f32: 4.0× for folo-n, 2.8× for folo-s. GPU end to end, batch 16, f16, FOLO on tensor cores: 3.5× for folo-n, 3.0× for folo-s. CPU forward, batch 1, f32: 1.8× for folo-n, 1.5× for folo-s. CPU end to end, batch 1, f32: 1.9× for folo-n, 1.7× for folo-s. Training step, batch 16, f32: 1.9× for folo-n, 1.5× for folo-s. Training step, batch 16, AMP: 2.4× for folo-n, 1.6× for folo-s.</desc>
<rect x="0.5" y="0.5" width="719" height="742" rx="8" fill="#FFFFFF" stroke="#E4E5E5"/>
<text x="28" y="43" font-size="17" font-weight="600" letter-spacing="-0.01em" fill="#0C0E12">Speed-up over the YOLO26 model of the same size</text>
<text x="28" y="66" font-size="13" fill="#4F5661">RTX 4080 SUPER, Core i7-14700KF, 640×640 input, medians of alternated runs</text>
<rect x="28" y="84" width="10" height="10" rx="2" fill="#0A8FD6"/>
<text x="44" y="93.5" font-size="12.5" fill="#4F5661">folo-n against yolo26n</text>
<rect x="199" y="84" width="10" height="10" rx="2" fill="#AD6C00"/>
<text x="215" y="93.5" font-size="12.5" fill="#4F5661">folo-s against yolo26s</text>
<path d="M28 112.5L692 112.5" stroke="#F1F1F1" stroke-width="1" fill="none"/>
<text x="28" y="138" font-size="13" xml:space="preserve"><tspan font-weight="600" fill="#0C0E12">Times faster</tspan><tspan font-size="12" fill="#646B75">   latency: YOLO26 over FOLO; throughput: FOLO over YOLO26</tspan></text>
