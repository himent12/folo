<text x="28" y="548" font-size="12" fill="#80868F">COCO: FOLO trained from scratch for 56 to 62 epochs. The YOLO26 numbers are the published ones, from models</text>
<text x="28" y="565" font-size="12" fill="#80868F">pretrained on Objects365 and trained for far longer. Fine-tuning: each from its own COCO weights, at its</text>
<text x="28" y="582" font-size="12" fill="#80868F">defaults, 100 epochs; the differences are of the unrounded means. &quot;level&quot;: inside the spread of the seeds, or</text>
<text x="28" y="599" font-size="12" fill="#80868F">on a set both saturate (signatures). Details: docs/BENCHMARKS.md, Accuracy.</text>
