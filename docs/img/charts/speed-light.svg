<title id="t">Speed &amp; memory: folo-n vs yolo26n</title>
<desc id="d">2x2 dashboard comparing folo-n against yolo26n. Latency at batch 1: GPU forward 1.09 vs 4.95 ms, GPU end to end 1.60 vs 6.92 ms, CPU forward 12.7 vs 22.8 ms, CPU end to end 13.6 vs 24.8 ms. Batch-16 GPU inference throughput: GPU forward, f32 2081 vs 1454 img/s, GPU forward, f16 4159 vs 2370 img/s, GPU end to end 2428 vs 615 img/s. Batch-16 training throughput: Training step, f32 380 vs 202 img/s, Training step, AMP 594 vs 252 img/s, Whole trainer, f32 388 vs 199 img/s, Whole trainer, AMP 613 vs 224 img/s. Peak GPU memory: Training step, f32 3467 vs 4517 MiB, Training step, AMP 2022 vs 2646 MiB.</desc>
