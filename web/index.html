<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FOLO Studio</title>
    <script id="first-paint">
      // Apply the saved theme before first paint so there is no flash (design/THEMES.md): the mode, then that mode's
      // theme. A built-in theme is its block in tokens.css (data-theme-id); a custom one is its base's block with its
      // own colours inline, and only when the whole stored entry passes the check the app runs (src/lib/design/themes.ts),
      // so only colour token properties are ever set. The app applies the same once it runs (applyTheme.ts);
      // firstPaint.test.ts holds the two to the same answers for every case of design/theme-cases.json and more.
      try {
        // Generated by scripts/tokens.mjs from design/tokens.json (npm run tokens; npm run check fails when stale): the
        // built-in theme ids of each mode, every colour token as its CSS custom property (a list: one per entry), and
        // the number tokens.
        const T = {"dark":["dark","midnight","dim","contrast-dark"],"light":["light","paper","contrast-light"],"id":"^[a-z0-9][a-z0-9-]{0,39}$","color":{"bg":{"app":"--bg-app","panel":"--bg-panel","raised":"--bg-raised","overlay":"--bg-overlay","inset":"--bg-inset","hover":"--bg-hover","active":"--bg-active","selected":"--bg-selected","scrim":"--bg-scrim"},"line":{"subtle":"--line-subtle","default":"--line-default","strong":"--line-strong","control":"--line-control"},"text":{"primary":"--text-primary","secondary":"--text-secondary","tertiary":"--text-tertiary","disabled":"--text-disabled","inverse":"--text-inverse"},"accent":{"solid":"--accent-solid","solid_hover":"--accent-solid-hover","on":"--accent-on","text":"--accent-text","line":"--accent-line","muted":"--accent-muted"},"success":{"solid":"--success-solid","text":"--success-text","muted":"--success-muted"},"warning":{"solid":"--warning-solid","text":"--warning-text","muted":"--warning-muted"},"danger":{"solid":"--danger-solid","text":"--danger-text","muted":"--danger-muted","fill":"--danger-fill","fill_hover":"--danger-fill-hover"},"info":{"solid":"--info-solid","text":"--info-text","muted":"--info-muted"},"window":{"close":"--window-close","close_text":"--window-close-text"},"focus":"--focus","chart":{"series":["--chart-1","--chart-2","--chart-3","--chart-4","--chart-5","--chart-6"],"fill":["--chart-fill-1","--chart-fill-2","--chart-fill-3","--chart-fill-4","--chart-fill-5","--chart-fill-6"],"text":["--chart-text-1","--chart-text-2","--chart-text-3","--chart-text-4","--chart-text-5","--chart-text-6"],"grid":"--chart-grid","axis":"--chart-axis","label":"--chart-label","cursor":"--chart-cursor","swatch_edge":"--chart-swatch-edge","context":"--chart-context","area_opacity":"--chart-area-opacity"}},"number":["--chart-area-opacity"]};
        const root = document.documentElement;
        // Every storage access guarded: on an opaque origin even touching `localStorage` throws.
        const raw = (k) => {
          try {
            return localStorage.getItem(k);
          } catch {
            return null;
          }
        };
        const read = (k) => {
          try {
            return JSON.parse(raw(k));
          } catch {
            return null;
          }
        };
        const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
        const hex = (v) => typeof v === 'string' && /^#([0-9a-f]{6}|[0-9a-f]{8})$/i.test(v);
        const trim = (s) => s.replace(/^\p{White_Space}+|\p{White_Space}+$/gu, '');
        const len = (s) => [...s].length;
        // The mode as prefs.ts reads it: a valid legacy folo.theme, else folo.prefs' theme, else dark.
        const prefs = isObj(read('folo.prefs')) ? read('folo.prefs') : {};
        const modes = ['dark', 'light', 'system'];
        const legacy = raw('folo.theme');
        const pref = modes.includes(legacy) ? legacy : modes.includes(prefs.theme) ? prefs.theme : 'dark';
        const mode = (pref === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : pref === 'dark') ? 'dark' : 'light';
        // A custom theme file as themes.ts checks it (design/THEMES.md, Custom themes); true when it passes.
        const KEYS = ['folo_theme', 'id', 'name', 'mode', 'base', 'description', 'color'];
        const leaf = (v, s) =>
          Array.isArray(s) ? Array.isArray(v) && v.length === s.length && v.every(hex) : typeof s === 'string' ? (T.number.includes(s) ? typeof v === 'number' && v >= 0 && v <= 1 : hex(v)) : group(v, s);
        const group = (v, s) => isObj(v) && Object.entries(v).every(([k, x]) => k.startsWith('$') || (Object.hasOwn(s, k) && leaf(x, s[k])));
        const valid = (c) =>
          isObj(c) &&
          Object.keys(c).every((k) => k.startsWith('$') || KEYS.includes(k)) &&
          c.folo_theme === 1 &&
          typeof c.id === 'string' &&
          new RegExp(T.id).test(c.id) &&
          !T.dark.includes(c.id) &&
          !T.light.includes(c.id) &&
          c.id !== 'system' &&
          typeof c.name === 'string' &&
          len(trim(c.name)) >= 1 &&
          len(trim(c.name)) <= 40 &&
          (c.description === undefined || (typeof c.description === 'string' && len(trim(c.description)) <= 120)) &&
          (c.mode === 'dark' || c.mode === 'light') &&
          (c.base === undefined || T[c.mode].includes(c.base)) &&
          (c.color === undefined || group(c.color, T.color));
        const id = prefs[mode + 'Theme'];
        const list = read('folo.themes');
        // The first entry with that id that passes, as prefs.ts keeps it; shown only when it is of this mode.
        const found = T[mode].includes(id) ? null : (Array.isArray(list) ? list : []).find((c) => isObj(c) && c.id === id && valid(c));
        const custom = found && found.mode === mode ? found : null;
        root.dataset.theme = mode;
        root.dataset.themeId = T[mode].includes(id) ? id : custom ? custom.base || mode : mode;
        const set = (v, s) => {
          for (const [k, x] of Object.entries(v)) {
            if (k.startsWith('$')) continue;
            const n = s[k];
            if (Array.isArray(n)) x.forEach((y, i) => root.style.setProperty(n[i], y.toLowerCase()));
            else if (typeof n === 'string') root.style.setProperty(n, typeof x === 'number' ? String(x) : x.toLowerCase());
            else set(x, n);
          }
        };
        if (custom) set(custom.color || {}, T.color);
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
