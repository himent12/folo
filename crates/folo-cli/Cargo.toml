[package]
name = "folo-cli"
description = "The folo command-line tool: train, val, predict, export, serve, mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Compile the built FOLO Studio into the binary so `folo serve` works without web/dist (see folo-server's build.rs).
embed-web = ["folo-server/embed-web"]

[dependencies]
folo-api.workspace = true
folo-data.workspace = true
folo-gpu.workspace = true
folo-nn.workspace = true
folo-server.workspace = true
folo-mcp.workspace = true
folo-vision.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
base64.workspace = true
image.workspace = true
jsonschema.workspace = true

[[bin]]
name = "folo"
path = "src/main.rs"
