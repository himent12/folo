[package]
name = "folo-gpu"
description = "FOLO GPU backend on wgpu (Vulkan / DX12 / Metal / WebGPU) with WGSL compute kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
folo-core.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
half.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

# In the browser, wgpu's WebGPU objects are only `Send + Sync` with this feature. It is sound for FOLO because
# the wasm build has no threads (no `atomics` target feature): everything runs on the page's one thread.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
folo-nn.workspace = true

[[bench]]
name = "gemm"
harness = false

[[bench]]
name = "conv"
harness = false

[[bench]]
name = "conv_model"
harness = false

[[bench]]
name = "elementwise"
harness = false

[[bench]]
name = "backend"
harness = false
