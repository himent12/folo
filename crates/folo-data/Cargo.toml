[package]
name = "folo-data"
description = "FOLO datasets, image IO, augmentation and data loading"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
image.workspace = true
rayon.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tar.workspace = true
thiserror.workspace = true
walkdir.workspace = true

# Available memory for `--cache ram` (src/ram_cache.rs): Windows and Linux ask the system themselves, which keeps
# sysinfo and the second `windows` crate it brings (0.61; wgpu and FOLO Desktop use 0.62) out of their builds.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation"] }

[target.'cfg(not(any(windows, target_os = "linux")))'.dependencies]
sysinfo.workspace = true

[dev-dependencies]
folo-test-support.workspace = true

[[bench]]
name = "pipeline"
harness = false
