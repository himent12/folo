<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOLO in the browser</title>
<style>
  :root { color-scheme: light dark; --fg: #1b1d21; --bg: #f6f7f9; --muted: #606672; --line: #d5d8de; --accent: #2f6fde; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e7e9ee; --bg: #15171b; --muted: #9aa1ad; --line: #30343c; --accent: #6c9cf0; } }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
  canvas { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; display: block; }
  #boxes { font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>FOLO in the browser</h1>
  <div class="row">
    <label>Model (.folo) <input id="model" type="file" accept=".folo"></label>
    <label>Image <input id="image" type="file" accept="image/*"></label>
  </div>
  <div class="row">
    <label>Backend
      <select id="backend"><option value="auto">auto</option><option value="webgpu">webgpu</option><option value="cpu">cpu</option></select>
    </label>
    <label>conf <input id="conf" type="number" min="0" max="1" step="0.05" value="0.25" style="width: 5em"></label>
    <button id="run" disabled>Detect</button>
    <button id="bench" disabled>Benchmark ×20</button>
  </div>
  <div id="status">Loading folo-wasm…</div>
  <canvas id="canvas" width="640" height="360"></canvas>
  <div id="boxes"></div>
</main>
<script type="module">
// Served from the repository root, the build output of scripts/build-wasm.sh is three levels up.
import init, { FoloDetector, hasWebGpu, version } from "../../../web/public/folo-wasm/folo_wasm.js";

const $ = (id) => document.getElementById(id);
const status = (s) => { $("status").textContent = s; };
const params = new URLSearchParams(location.search);
let detector = null, detectorKey = null, modelBytes = null, imageData = null, bitmap = null, loadMs = 0;

const COLORS = ["#e6194b", "#3cb44b", "#4363d8", "#f58231", "#911eb4", "#42d4f4", "#f032e6", "#bfef45"];

async function loadImage(blob) {
  bitmap = await createImageBitmap(blob);
  const c = new OffscreenCanvas(bitmap.width, bitmap.height);
  const g = c.getContext("2d");
  g.drawImage(bitmap, 0, 0);
  imageData = g.getImageData(0, 0, bitmap.width, bitmap.height);
  draw([]);
}

async function ensureDetector(backend) {
  const key = backend + ":" + modelBytes.length;
  if (detector && detectorKey === key) return detector;
  detector?.free();
  detector = null;
  status(`Loading model on ${backend}…`);
  const t = performance.now();
  const imgsz = params.get("imgsz") ? Number(params.get("imgsz")) : undefined;
  detector = await FoloDetector.load(modelBytes, { backend, modelId: "demo", imgsz });
  detectorKey = key;
  loadMs = performance.now() - t;
  const info = detector.info();
  console.log("folo-wasm info", info);
  status(`Loaded ${info.arch} (${info.classes.length} classes, imgsz ${info.imgsz}) on ${info.backend}` +
    (info.adapter ? ` [${info.adapter}]` : "") + (info.backend === "cpu" ? ` [simd128 ${info.simd128}]` : "") +
    (info.fallback ? `\nWebGPU fallback: ${info.fallback}` : "") + ` in ${loadMs.toFixed(0)} ms`);
  return detector;
}

function draw(boxes) {
  const c = $("canvas");
  c.width = bitmap.width; c.height = bitmap.height;
  const g = c.getContext("2d");
  g.drawImage(bitmap, 0, 0);
  g.lineWidth = Math.max(2, bitmap.width / 320);
  g.font = `${Math.max(12, bitmap.width / 50)}px system-ui`;
  for (const b of boxes) {
    const col = COLORS[b.class % COLORS.length];
    g.strokeStyle = col; g.fillStyle = col;
    g.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
    const label = `${b.name} ${b.score.toFixed(2)}`;
    const w = g.measureText(label).width + 6, h = parseInt(g.font) + 4;
    g.fillRect(b.x1, Math.max(0, b.y1 - h), w, h);
    g.fillStyle = "#fff";
    g.fillText(label, b.x1 + 3, Math.max(0, b.y1 - h) + h - 5);
  }
  $("boxes").textContent = boxes.map((b) => `${b.name} ${b.score.toFixed(3)} [${b.x1.toFixed(1)}, ${b.y1.toFixed(1)}, ${b.x2.toFixed(1)}, ${b.y2.toFixed(1)}]`).join("\n");
}

async function detect(backend, conf) {
  const det = await ensureDetector(backend);
  return det.detect(imageData, undefined, undefined, { conf, iou: 0.7, maxDet: 300 });
}

/** Runs `runs` detections after `warmup` and reports the median and min of the timings (ms). */
async function bench(backend, runs = 20, warmup = 3, conf = 0.25) {
  await ensureDetector(backend);
  let first = performance.now();
  await detect(backend, conf);
  first = performance.now() - first;
  for (let i = 1; i < warmup; i++) await detect(backend, conf);
  const wall = [], total = [];
  let last;
  for (let i = 0; i < runs; i++) {
    const t = performance.now();
    last = await detect(backend, conf);
    wall.push(performance.now() - t);
    total.push(last.timing.total_ms);
  }
  const med = (a) => [...a].sort((x, y) => x - y)[a.length >> 1];
  const r = { backend: detector.backend, info: detector.info(), load_ms: loadMs, first_ms: first, runs,
              wall_ms_median: med(wall), wall_ms_min: Math.min(...wall), total_ms_median: med(total), last };
  draw(last.boxes);
  status(`${r.backend}: median ${r.wall_ms_median.toFixed(1)} ms per image (min ${r.wall_ms_min.toFixed(1)}), ` +
    `${runs} runs after ${warmup} warm-up; load ${loadMs.toFixed(0)} ms, first call ${first.toFixed(0)} ms`);
  return r;
}

function ready() {
  const ok = modelBytes && imageData;
  $("run").disabled = !ok; $("bench").disabled = !ok;
}

$("model").onchange = async (e) => { modelBytes = new Uint8Array(await e.target.files[0].arrayBuffer()); detector?.free(); detector = null; ready(); };
$("image").onchange = async (e) => { await loadImage(e.target.files[0]); ready(); };
$("run").onclick = async () => {
  try {
    const r = await detect($("backend").value, Number($("conf").value));
    draw(r.boxes);
    const t = r.timing;
    status(`${r.boxes.length} boxes on ${r.backend}: total ${t.total_ms.toFixed(1)} ms ` +
      `(pre ${t.preprocess_ms.toFixed(1)}, inference ${t.inference_ms.toFixed(1)}, post ${t.postprocess_ms.toFixed(1)})`);
  } catch (e) { status(String(e)); console.error(e); }
};
$("bench").onclick = async () => {
  try {
    status("Benchmarking…");
    await bench($("backend").value, 20, 3, Number($("conf").value));
  } catch (e) { status(String(e)); console.error(e); }
};

// For automated tests (crates/folo-wasm/demo/test.mjs): `?model=<url>&image=<url>` preloads both, and
// `&imgsz=<n>` overrides the model's letterbox size.
window.foloDemo = {
  async setup(modelUrl, imageUrl) {
    modelBytes = new Uint8Array(await (await fetch(modelUrl)).arrayBuffer());
    await loadImage(await (await fetch(imageUrl)).blob());
    detector?.free(); detector = null;
    ready();
  },
  async detect(backend, conf = 0.25) { const r = await detect(backend, conf); draw(r.boxes); return { result: r, info: detector.info() }; },
  bench,
  hasWebGpu,
  /** Bad inputs must reject (not throw, not hang): returns `{ case: "rejected: <message>" | <problem> }`. */
  async probeErrors() {
    // A view whose buffer is transferred after the view was made (making a view of a detached buffer throws).
    const detached = (View) => {
      const b = new ArrayBuffer(16);
      const v = View ? new View(b) : b;
      structuredClone(b, { transfer: [b] });
      return v;
    };
    const det = detector;
    const cases = {
      "load detached ArrayBuffer": () => FoloDetector.load(detached()),
      "load detached view": () => FoloDetector.load(detached(Uint8Array)),
      "load not bytes": () => FoloDetector.load(42),
      "load bad options": () => FoloDetector.load(modelBytes, { backend: "cuda" }),
      "load function options": () => FoloDetector.load(modelBytes, () => 1),
      "load symbol options": () => FoloDetector.load(modelBytes, Symbol("x")),
      "load toJSON options": () => FoloDetector.load(modelBytes, { toJSON() { return undefined; } }),
      "detect function options": () => det.detect(imageData, undefined, undefined, () => 1),
      "detect detached": () => det.detect(detached(Uint8ClampedArray), 2, 2),
      "detect wrong size": () => det.detect(new Uint8Array(15), 2, 2),
      "detect huge": () => det.detect(new Uint8Array(0), 65536, 65536),
      "detect no size": () => det.detect(new Uint8Array(16)),
      "detect bad conf": () => det.detect(imageData, undefined, undefined, { conf: 2 }),
    };
    const out = {};
    for (const [name, f] of Object.entries(cases)) {
      let p;
      try {
        p = f();
      } catch (e) {
        out[name] = `threw synchronously: ${e}`;
        continue;
      }
      out[name] = await Promise.race([
        p.then(() => "resolved", (e) => (e instanceof Error && e.message ? `rejected: ${e.message}` : `rejected with a non-Error: ${e}`)),
        new Promise((r) => setTimeout(() => r("pending"), 5000)),
      ]);
    }
    return out;
  },
};

await init();
status(`folo-wasm ${version()} ready. WebGPU ${hasWebGpu() ? "available" : "not available"} in this browser.`);
if (params.get("model") && params.get("image")) await window.foloDemo.setup(params.get("model"), params.get("image"));
window.foloDemoReady = true;
</script>
</body>
</html>
