[package]
name = "folo-vision"
description = "FOLO detection models, losses, assigners, NMS and metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# The detection math (boxes, decode, NMS, metrics, assigner) is tensor-free; the loss and the `model` module
# build on folo-core / folo-nn. The trainer and predictor read data through folo-data and speak docs/API.md's
# event types (folo-api).
folo-api.workspace = true
folo-core.workspace = true
folo-data.workspace = true
folo-nn.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# `std::time::Instant` panics in the browser; web-time reads `performance.now()` there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true

[dev-dependencies]
# GPU tests (tests/gpu.rs) and the GPU benchmark; both skip without an adapter.
folo-gpu.workspace = true

[[bench]]
name = "post"
harness = false

[[bench]]
name = "loss"
harness = false

[[bench]]
name = "model"
harness = false

[[bench]]
name = "train_step"
harness = false

[[bench]]
name = "gpu"
harness = false
