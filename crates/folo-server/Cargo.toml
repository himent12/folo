[package]
name = "folo-server"
description = "FOLO Studio server: HTTP + SSE API for datasets, training runs and inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Compile the built FOLO Studio (web/dist, or $FOLO_WEB_DIST) into the binary; see build.rs.
embed-web = []

[dependencies]
folo-api.workspace = true
folo-core.workspace = true
folo-data.workspace = true
folo-gpu.workspace = true
folo-nn.workspace = true
folo-vision.workspace = true
walkdir.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-stream.workspace = true
tokio-util.workspace = true
httpdate.workspace = true
futures-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
image.workspace = true
sysinfo.workspace = true

[dev-dependencies]
tower.workspace = true
http-body-util.workspace = true
