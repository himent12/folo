[package]
name = "folo-api"
description = "FOLO HTTP API types (docs/API.md), shared by the engine, the services, the CLI and FOLO Desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# `schemars::JsonSchema` for every type, so the MCP server (docs/MCP.md) and `folo describe` can publish JSON Schemas
# generated from the wire types. Off by default to keep the crate light for FOLO Desktop.
schema = ["dep:schemars"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }
