name: Feature request
description: Something FOLO should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, and where FOLO gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: A command, a flag, an API field, a screen. docs/ROADMAP.md lists what is already planned.
