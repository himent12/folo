name: site
# The docs site (site/README.md), generated from docs/, README.md and examples/*/README.md: `npm run check`
# type-checks it and fails on a broken link, anchor or image; `npm run build` builds it (the same checks again).
# It runs for every pull request, whatever it touches: the Markdown links to files all over the repository, and a
# link to a file that was deleted or renamed is a broken link. It also checks that the charts in docs/img/charts
# are what their data gives. It takes about 20 seconds.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
# Runners: see ci.yml. RUNS_ON_LINUX holds a JSON runs-on value; unset falls back to GitHub-hosted Linux.
jobs:
  site:
    runs-on: ${{ fromJSON((!github.event.pull_request.head.repo.fork && vars.RUNS_ON_LINUX) || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No god files (AGENTS.md, Ground rules): a source file of 1000 lines or more fails the pull request. It is
      # here because this is the one workflow that runs for every pull request, and it takes a second.
      - name: file sizes
        run: bash tools/file-size.sh
      # Node 24 runs the TypeScript build scripts directly (type stripping).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The charts of the README and docs are generated files (docs/BENCHMARKS.md, Charts): a committed chart that
      # differs from what tools/charts/data.json gives fails here.
      - name: charts
        run: node tools/charts/render.mjs --check
      - working-directory: site
        run: npm ci && npm run check && npm run build
