name: runners
# Keeps the Linux CI runners up. They are boat.dev sandboxes with a 24 h TTL (docs/CI.md, Operating the runners); an
# expired one goes offline and its jobs queue until someone renews it. Four times a day the dev PC's runner, which
# has the boat key and the gh login, extends every sandbox's TTL and restarts a runner listener that stopped.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
concurrency:
  group: runners
  cancel-in-progress: false
permissions: {}
jobs:
  renew:
    # Only where both kinds of self-hosted runner are configured (see ci.yml).
    if: vars.RUNS_ON_WINDOWS != '' && vars.RUNS_ON_LINUX != ''
    runs-on: ${{ fromJSON(vars.RUNS_ON_WINDOWS) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # One runner per ~/.folo/gha_linux<n>_sid. The script reads the boat key and asks gh for what it needs; it
      # prints neither. A runner that cannot be renewed fails the job after the others had their turn.
      - name: renew the boat.dev runners
        shell: bash
        run: |
          rc=0
          for f in "$HOME"/.folo/gha_linux*_sid; do
            [ -e "$f" ] || continue
            n="${f##*gha_linux}"
            python tools/gha_boat_runner.py renew "${n%_sid}" || rc=1
          done
          exit "$rc"
