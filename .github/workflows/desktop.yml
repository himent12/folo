name: desktop
# FOLO Desktop (GPUI) is its own cargo workspace and a slow build, so it only runs when the app, the design
# tokens it is generated from, the wire types it shares, or the engine crates it runs locally change.
on:
  pull_request:
    paths:
      - apps/desktop/**
      - design/**
      - crates/folo-api/**
      - crates/folo-core/**
      - crates/folo-data/**
      - crates/folo-gpu/**
      - crates/folo-nn/**
      - crates/folo-vision/**
      - .github/workflows/desktop.yml
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - design/**
      - crates/folo-api/**
      - crates/folo-core/**
      - crates/folo-data/**
      - crates/folo-gpu/**
      - crates/folo-nn/**
      - crates/folo-vision/**
      - .github/workflows/desktop.yml
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
# Runners: see ci.yml. RUNS_ON_WINDOWS holds a JSON runs-on value; unset falls back to GitHub-hosted Windows.
jobs:
  desktop:
    # Builds on Windows, where it ships first.
    runs-on: ${{ fromJSON(vars.RUNS_ON_WINDOWS || '"windows-latest"') }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Self-hosted runners keep a persistent target dir outside the checkout (checkout cleans ignored files).
      - name: persistent target dir (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: powershell
        run: Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=D:\gha\folo-desktop-target-$env:RUNNER_NAME"
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - name: fmt
        shell: bash
        env:
          ATTEMPTS: ${{ runner.environment == 'self-hosted' && '2' || '1' }}
        run: |
          for i in $(seq 1 "$ATTEMPTS"); do
            cargo fmt --all -- --check && exit 0
            [ "$i" -lt "$ATTEMPTS" ] && echo "::warning::fmt failed on attempt $i; retrying (unstable self-hosted host, docs/CI.md)"
          done
          exit 1
      - name: clippy
        shell: bash
        env:
          ATTEMPTS: ${{ runner.environment == 'self-hosted' && '2' || '1' }}
        run: |
          for i in $(seq 1 "$ATTEMPTS"); do
            cargo clippy --all-targets -- -D warnings && exit 0
            [ "$i" -lt "$ATTEMPTS" ] && echo "::warning::clippy failed on attempt $i; retrying (unstable self-hosted host, docs/CI.md)"
          done
          exit 1
      - name: build
        shell: bash
        env:
          ATTEMPTS: ${{ runner.environment == 'self-hosted' && '2' || '1' }}
        run: |
          for i in $(seq 1 "$ATTEMPTS"); do
            cargo build && exit 0
            [ "$i" -lt "$ATTEMPTS" ] && echo "::warning::build failed on attempt $i; retrying (unstable self-hosted host, docs/CI.md)"
          done
          exit 1
      - name: test
        shell: bash
        env:
          ATTEMPTS: ${{ runner.environment == 'self-hosted' && '2' || '1' }}
        run: |
          for i in $(seq 1 "$ATTEMPTS"); do
            cargo test && exit 0
            [ "$i" -lt "$ATTEMPTS" ] && echo "::warning::test failed on attempt $i; retrying (unstable self-hosted host, docs/CI.md)"
          done
          exit 1
