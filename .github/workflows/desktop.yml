name: desktop
# FOLO Desktop (GPUI) is its own cargo workspace and a slow build, so it only runs when the app, the design
# tokens it is generated from, the wire types it shares, or the engine crates it runs locally change.
on:
  pull_request:
    paths:
      - apps/desktop/**
      - design/**
      - crates/folo-api/**
      - crates/folo-core/**
      - crates/folo-data/**
      - crates/folo-gpu/**
      - crates/folo-nn/**
      - crates/folo-vision/**
      - .github/workflows/desktop.yml
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - design/**
      - crates/folo-api/**
      - crates/folo-core/**
      - crates/folo-data/**
      - crates/folo-gpu/**
      - crates/folo-nn/**
      - crates/folo-vision/**
      - .github/workflows/desktop.yml
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
# Runners: see ci.yml. RUNS_ON_WINDOWS holds a JSON runs-on value; unset falls back to GitHub-hosted Windows.
jobs:
  desktop:
    # Builds on Windows, where it ships first.
    runs-on: ${{ fromJSON(vars.RUNS_ON_WINDOWS || '"windows-latest"') }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Self-hosted runners keep a persistent target dir outside the checkout (checkout cleans ignored files).
      - name: persistent target dir (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: powershell
        run: Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=D:\gha\folo-desktop-target-$env:RUNNER_NAME"
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build
      - run: cargo test
