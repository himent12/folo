name: desktop
# FOLO Desktop (GPUI) is its own cargo workspace and a slow build, so it only runs when the app, the design
# tokens it is generated from, the wire types it shares, or the engine crates it runs locally change, and on every
# push to main.
on:
  pull_request:
    paths:
      - apps/desktop/**
      - design/**
      - crates/folo-api/**
      - crates/folo-client/**
      - crates/folo-cloud/**
      - crates/folo-core/**
      - crates/folo-data/**
      - crates/folo-gpu/**
      - crates/folo-nn/**
      - crates/folo-test-support/**
      - crates/folo-vision/**
      - .github/workflows/desktop.yml
  push:
    branches: [main]
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
# Runners: see ci.yml. RUNS_ON_WINDOWS holds a JSON runs-on value; unset falls back to GitHub-hosted Windows.
jobs:
  desktop:
    # Builds on Windows, where it ships first.
    runs-on: ${{ fromJSON(vars.RUNS_ON_WINDOWS || '"windows-latest"') }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Self-hosted runners keep a persistent target dir outside the checkout (checkout cleans ignored files).
      - name: persistent target dir (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: powershell
        run: Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=D:\gha\folo-desktop-target-$env:RUNNER_NAME"
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - name: fmt
        shell: bash
        env:
          ATTEMPTS: ${{ runner.environment == 'self-hosted' && '2' || '1' }}
        run: bash ../../tools/ci-retry.sh cargo fmt --all -- --check
      - name: clippy
        shell: bash
        env:
          ATTEMPTS: ${{ runner.environment == 'self-hosted' && '2' || '1' }}
        run: bash ../../tools/ci-retry.sh cargo clippy --all-targets -- -D warnings
      # No separate `cargo build`: clippy type-checks every target and the tests compile and link the same code.
      - name: test
        shell: bash
        env:
          ATTEMPTS: ${{ runner.environment == 'self-hosted' && '2' || '1' }}
        run: bash ../../tools/ci-retry.sh cargo test
      # The vendored GPUI's one patch (README.md, "Vendored GPUI"): truncated, then untruncated, measures keep runs
      # that cover the text on character boundaries. Built from the vendor's own manifest and lock.
      - name: vendored GPUI patch test
        shell: bash
        env:
          ATTEMPTS: ${{ runner.environment == 'self-hosted' && '2' || '1' }}
        run: bash ../../tools/ci-retry.sh cargo test --manifest-path vendor/gpui/Cargo.toml --lib folo_truncation
      # The workspace's temp-dir hygiene test (docs/CI.md, Test temp dirs) also scans apps/desktop/src, and ci.yml
      # does not run for a change to the app alone.
      - name: temp-dir hygiene
        shell: bash
        env:
          ATTEMPTS: ${{ runner.environment == 'self-hosted' && '2' || '1' }}
        run: bash ../../tools/ci-retry.sh cargo test --manifest-path ../../Cargo.toml -p folo-test-support --test hygiene
