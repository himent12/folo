name: release

# Release builds of the `folo` CLI (FOLO Studio embedded, so `folo serve` works out of the box) and FOLO Desktop.
#
# - Push a tag `vX.Y.Z` equal to `[workspace.package] version` in Cargo.toml: builds everything and creates a
#   *draft* GitHub Release with generated notes, the archives, a `.sha256` per archive and `SHA256SUMS`.
#   Review the draft and publish it by hand; the install scripts only see published releases.
# - Run it by hand (workflow_dispatch) for a dry run: the same builds, uploaded as run artifacts, no release. With
#   the `tag` input it also rehearses that tag: the version check and a preview of the release notes, still without
#   creating anything (docs/RELEASE.md).
# - Pull requests that touch the release machinery get the same dry run (without macOS) plus an install-script test.
#
# Assets (names carry no version so `releases/latest/download/<asset>` URLs stay stable):
#   folo-x86_64-pc-windows-msvc.zip, folo-x86_64-unknown-linux-gnu.tar.gz, folo-aarch64-apple-darwin.tar.gz,
#   folo-desktop-x86_64-pc-windows-msvc.zip, each with a `<asset>.sha256`, plus SHA256SUMS.
# Each CLI archive holds one folder `folo-<target>/` with the binary, README.md and the licenses.
#
# Runners: as in ci.yml, the repo variables RUNS_ON_LINUX / RUNS_ON_WINDOWS (a JSON runs-on value) select FOLO's
# self-hosted runners, falling back to GitHub-hosted ones when unset. macOS has no self-hosted runner: it always uses
# GitHub-hosted macos-latest, and FOLO_RELEASE_MACOS=false skips it (docs/RELEASE.md, Runners).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/install.sh
      - scripts/install.ps1
      - scripts/build-wasm.sh
      - crates/folo-cli/build.rs
      - crates/folo-server/build.rs
      - crates/folo-server/src/web.rs
  workflow_dispatch:
    inputs:
      macos:
        description: Also build aarch64-apple-darwin (GitHub-hosted, 10x minutes; FOLO_RELEASE_MACOS=false overrides)
        type: boolean
        default: true
      tag:
        description: Rehearse this tag (vX.Y.Z) - check it against the version and preview its notes; creates nothing
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          # The tag being released (push) or rehearsed (workflow_dispatch's `tag`, may be empty).
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          # Tag builds and dispatches (unless `macos` is off) include macOS; PRs never do. The repository variable
          # FOLO_RELEASE_MACOS=false skips it everywhere, e.g. while GitHub-hosted runners are unavailable.
          MACOS: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.macos) && vars.FOLO_RELEASE_MACOS != 'false' }}
          # JSON runs-on values for the matrix (empty: GitHub-hosted, see the fallbacks below).
          RUNS_ON_LINUX: ${{ vars.RUNS_ON_LINUX }}
          RUNS_ON_WINDOWS: ${{ vars.RUNS_ON_WINDOWS }}
        run: |
          set -euo pipefail
          # The single source of truth: [workspace.package] version in the root Cargo.toml.
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$version" || { echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; }
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version (expected v$version)"
            exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          # Each entry's runs-on is a JSON string for fromJSON, like ci.yml's. The hosted Linux fallback is
          # ubuntu-22.04 (glibc 2.35) so the binary runs on older distributions; the cli job checks that floor on
          # every runner, since the self-hosted ones are Ubuntu 24.04.
          # macOS is optional: a failed macOS build does not block the release (continue-on-error).
          linux=${RUNS_ON_LINUX:-'"ubuntu-22.04"'}
          windows=${RUNS_ON_WINDOWS:-'"windows-latest"'}
          for v in "$linux" "$windows"; do
            jq -e . >/dev/null <<<"$v" || { echo "::error::runs-on variable is not JSON: $v"; exit 1; }
          done
          include=$(jq -cn --arg linux "$linux" --arg windows "$windows" '[
            {target: "x86_64-pc-windows-msvc", "runs-on": $windows, exe: ".exe", optional: false},
            {target: "x86_64-unknown-linux-gnu", "runs-on": $linux, exe: "", optional: false}]')
          if [ "$MACOS" = true ]; then
            include=$(jq -c '. + [{target: "aarch64-apple-darwin", "runs-on": "\"macos-latest\"", exe: "", optional: true}]' <<<"$include")
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "matrix=$(jq -c '{include: .}' <<<"$include")"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "FOLO $version ($EVENT, tag: ${TAG:-none}, macOS: $MACOS, Linux: $linux, Windows: $windows)" >> "$GITHUB_STEP_SUMMARY"

  # FOLO Studio with folo-wasm (docs/WASM.md) in it, so the embedded Playground can run models in the browser:
  # scripts/build-wasm.sh writes web/public/folo-wasm/ (SIMD128, wasm-opt -O3) and `vite build` copies it to dist/.
  web:
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 45
    env:
      # Pinned: binaryen's wasm-opt, verified against the release's published checksum.
      BINARYEN_VERSION: "133"
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
    steps:
      - uses: actions/checkout@v4
      # Release builds start from an empty target dir on every runner (no rust-cache, no CI target dir), so nothing
      # stale from earlier builds reaches a shipped binary; the runner deletes RUNNER_TEMP after the job.
      - name: fresh target dir
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/folo-release-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Both tools are installed per job (wasm-bindgen pinned to Cargo.lock and checksummed by install-action,
      # wasm-opt pinned and checksummed below), so self-hosted runners need nothing preinstalled.
      - name: wasm-bindgen CLI matching Cargo.lock
        run: echo "WASM_BINDGEN_VERSION=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - name: wasm-opt (binaryen)
        run: |
          set -euo pipefail
          name="binaryen-version_${BINARYEN_VERSION}"
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${name}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  binaryen.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/binaryen"
          tar -xzf binaryen.tar.gz -C "$RUNNER_TEMP/binaryen"
          rm binaryen.tar.gz
          echo "$RUNNER_TEMP/binaryen/$name/bin" >> "$GITHUB_PATH"
      - name: folo-wasm
        run: |
          set -euo pipefail
          wasm-opt --version
          sh scripts/build-wasm.sh --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm run build
      - name: check web/dist
        run: |
          set -euo pipefail
          test -f web/dist/index.html
          test -f web/dist/folo-wasm/folo_wasm.js
          test -f web/dist/folo-wasm/folo_wasm_bg.wasm
          # Exactly the module built above (vite copies public/ as is).
          cmp web/public/folo-wasm/folo_wasm_bg.wasm web/dist/folo-wasm/folo_wasm_bg.wasm
          wc -c web/dist/folo-wasm/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  cli:
    name: cli (${{ matrix.target }})
    needs: [plan, web]
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FOLO_GIT_SHA: ${{ github.sha }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      EXE: ${{ matrix.exe }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # A fresh target dir (see the web job) and a throwaway FOLO_HOME, so the smoke test never reads the runner
      # account's own ~/.folo (the self-hosted Windows runner is the developer account, docs/CI.md).
      - name: fresh target and data dirs
        run: |
          tmp=$RUNNER_TEMP
          if [ "$RUNNER_OS" = Windows ]; then tmp=$(cygpath -m "$tmp"); fi
          echo "CARGO_TARGET_DIR=$tmp/folo-release-target" >> "$GITHUB_ENV"
          echo "FOLO_HOME=$tmp/folo-home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The self-hosted Windows host occasionally crashes rustc: tools/ci-retry.sh retries once on a crash only.
      - name: build
        env:
          ATTEMPTS: ${{ runner.environment == 'self-hosted' && runner.os == 'Windows' && '2' || '1' }}
        run: bash tools/ci-retry.sh cargo build --release --locked -p folo-cli --features embed-web --target "$TARGET"
      # The binary must run on glibc 2.35 (Ubuntu 22.04) even when built on a newer system (self-hosted: 24.04).
      - name: glibc floor
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          floor=2.35
          need=$(objdump -T "$CARGO_TARGET_DIR/$TARGET/release/folo" | grep -o 'GLIBC_[0-9][0-9.]*' | cut -c7- | sort -uV | tail -n 1)
          echo "highest glibc symbol version: $need (floor $floor)"
          if [ "$(printf '%s\n%s\n' "$need" "$floor" | sort -V | tail -n 1)" != "$floor" ]; then
            echo "::error::folo needs glibc $need, newer than the supported floor $floor"
            exit 1
          fi
      - name: smoke test
        run: |
          set -euo pipefail
          exe="$CARGO_TARGET_DIR/$TARGET/release/folo$EXE"
          "$exe" --version
          "$exe" doctor --json > doctor.json
          grep -q '"web_source":"embedded"' doctor.json || { cat doctor.json; exit 1; }
          grep -q '"web_folo_wasm":true' doctor.json || { echo "no folo-wasm in the embedded Studio"; cat doctor.json; exit 1; }
          # Without --web-dir the embedded Studio wins over the web/dist checked out here.
          "$exe" serve --mock --port 0 --json > serve.log &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do grep -q '"listening"' serve.log && break; sleep 0.1; done
          url=$(sed -n 's/.*"url":"\([^"]*\)".*/\1/p' serve.log | head -n 1)
          test -n "$url" || { echo "server did not start"; cat serve.log; exit 1; }
          curl -fsS "$url/api/health"
          curl -fsS -o index.html "$url/" && grep -qi '<!doctype html>' index.html
          curl -fsS -o spa.html "$url/runs/some-run" && grep -qi '<!doctype html>' spa.html
          # folo-wasm, as the Playground loads it: a real module (not the SPA fallback) with the wasm MIME type.
          type=$(curl -fsS -o folo_wasm_bg.wasm -w '%{content_type}' "$url/folo-wasm/folo_wasm_bg.wasm")
          test "$type" = application/wasm || { echo "folo_wasm_bg.wasm served as $type"; exit 1; }
          test "$(head -c 4 folo_wasm_bg.wasm | od -An -tx1 | tr -d ' \n')" = 0061736d || { echo "not a wasm module"; exit 1; }
          curl -fsS -o folo_wasm.js "$url/folo-wasm/folo_wasm.js" && grep -q FoloDetector folo_wasm.js
      - name: package
        run: |
          set -euo pipefail
          name="folo-$TARGET"
          mkdir -p "pkg/$name" dist
          cp "$CARGO_TARGET_DIR/$TARGET/release/folo$EXE" README.md LICENSE-MIT LICENSE-APACHE "pkg/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            archive="$name.zip"
            # Windows' own bsdtar writes the zip (7-Zip is not on the self-hosted runner).
            (cd pkg && "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -a -c -f "../dist/$archive" "$name")
          else
            archive="$name.tar.gz"
            tar -C pkg -czf "dist/$archive" "$name"
          fi
          cd dist
          if command -v sha256sum >/dev/null; then sum=$(sha256sum "$archive"); else sum=$(shasum -a 256 "$archive"); fi
          printf '%s  %s\n' "${sum%% *}" "$archive" > "$archive.sha256"
          cat "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # A separate job: a desktop failure never blocks the CLI release (the release job only requires `cli`).
  desktop:
    needs: plan
    runs-on: ${{ fromJSON(vars.RUNS_ON_WINDOWS || '"windows-latest"') }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: check for the desktop app
        id: desktop
        run: test -f apps/desktop/Cargo.toml && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - name: check the desktop version
        if: steps.desktop.outputs.present == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          desktop=$(sed -n '/^\[package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' apps/desktop/Cargo.toml)
          if [ "$desktop" != "$VERSION" ]; then
            echo "::error::apps/desktop/Cargo.toml has version $desktop, the workspace has $VERSION"
            exit 1
          fi
      # A fresh target dir, as in the cli job.
      - name: fresh target dir
        if: steps.desktop.outputs.present == 'true'
        run: echo "CARGO_TARGET_DIR=$(cygpath -m "$RUNNER_TEMP")/folo-desktop-release-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.desktop.outputs.present == 'true'
      - name: build
        if: steps.desktop.outputs.present == 'true'
        env:
          ATTEMPTS: ${{ runner.environment == 'self-hosted' && '2' || '1' }}
        run: bash tools/ci-retry.sh cargo build --profile dist --locked --manifest-path apps/desktop/Cargo.toml
      - name: smoke test
        if: steps.desktop.outputs.present == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          exe=$CARGO_TARGET_DIR/dist/folo-desktop.exe
          test "$("$exe" --version | tr -d '\r')" = "folo-desktop $VERSION"
          "$exe" --help | grep -q 'Usage: folo-desktop'
      - name: package
        if: steps.desktop.outputs.present == 'true'
        run: |
          set -euo pipefail
          archive=folo-desktop-x86_64-pc-windows-msvc.zip
          mkdir -p pkg dist
          cp "$CARGO_TARGET_DIR/dist/folo-desktop.exe" LICENSE-MIT LICENSE-APACHE pkg/
          (cd pkg && "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -a -c -f "../dist/$archive" ./*)
          cd dist
          sum=$(sha256sum "$archive")
          printf '%s  %s\n' "${sum%% *}" "$archive" > "$archive.sha256"
          cat "$archive.sha256"
      - uses: actions/upload-artifact@v4
        if: steps.desktop.outputs.present == 'true'
        with:
          name: desktop-x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error

  release:
    needs: [plan, cli, desktop]
    # Runs even when `desktop` failed; needs every required CLI build (optional legs use continue-on-error).
    if: ${{ !cancelled() && needs.cli.result == 'success' }}
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # No checkout here, so on a self-hosted runner the workspace still holds whatever an earlier job left in it:
      # start from an empty dist/ so only this run's assets are checked and released.
      - name: empty dist
        run: rm -rf dist
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.desktop.result == 'success'
        continue-on-error: true # the desktop job succeeds without an artifact when apps/desktop is absent
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -c ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          {
            echo "### Assets"
            echo '```'
            ls -l
            echo
            cat SHA256SUMS
            echo '```'
            echo "desktop job: ${{ needs.desktop.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: dist/*
      # workflow_dispatch with `tag`: what the tag build would do, without doing it.
      - name: rehearse the draft release
        if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = true ]; then
              echo "A draft $TAG exists: the tag build would replace its assets."
            else
              echo "::warning::release $TAG is already published: the tag build would refuse to run; bump the version"
            fi
          else
            echo "No release $TAG yet: the tag build would create a draft \"FOLO $VERSION\" (prerelease: $PRERELEASE)."
          fi
          # The notes the draft would get (GitHub's generated notes, nothing is saved).
          notes=$(gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body)
          {
            echo "### Release notes preview for $TAG (dry run, nothing created)"
            echo
            echo "$notes"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$notes"
      - name: draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            # A re-run: refresh the assets of the existing draft, but never touch a published release.
            if [ "$draft" != true ]; then
              echo "::error::release $TAG is already published; delete it or tag a new version instead of re-running"
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" dist/* --draft --verify-tag --generate-notes --title "FOLO $VERSION" "${flags[@]}"
          fi

  # Installs the archives just built with the install scripts, the way users will (from a local folder of assets).
  install-test:
    needs: [plan, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runs-on: ${{ vars.RUNS_ON_LINUX || '"ubuntu-22.04"' }}
          - os: windows
            runs-on: ${{ vars.RUNS_ON_WINDOWS || '"windows-latest"' }}
    name: install-test (${{ matrix.os }})
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    timeout-minutes: 20
    env:
      # Ubuntu 22.04 (glibc 2.35, the Linux floor), pinned by digest.
      UBUNTU_2204: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: assets
      # A throwaway FOLO_HOME, as in the cli job.
      - name: fresh data dir
        shell: bash
        run: echo "FOLO_HOME=$RUNNER_TEMP/folo-home" >> "$GITHUB_ENV"
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          set -eu
          sh scripts/install.sh --base-url "$PWD/assets" --dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/folo" --version
          "$RUNNER_TEMP/bin/folo" doctor --json | grep -q '"web_source":"embedded"'
          "$RUNNER_TEMP/bin/folo" doctor --json | grep -q '"web_folo_wasm":true'
          # A tampered archive must be refused.
          cp -r assets bad && echo junk >> bad/folo-x86_64-unknown-linux-gnu.tar.gz
          if sh scripts/install.sh --base-url "$PWD/bad" --dir "$RUNNER_TEMP/bad"; then exit 1; fi
          test ! -e "$RUNNER_TEMP/bad/folo"
      # The installed binary on the oldest supported glibc, whatever the runner's own distribution is.
      - name: folo on Ubuntu 22.04
        if: runner.os != 'Windows'
        run: |
          set -eu
          docker run --rm -v "$RUNNER_TEMP/bin:/opt/folo:ro" "$UBUNTU_2204" sh -c '
            set -eu
            /opt/folo/folo --version
            /opt/folo/folo doctor --json > /tmp/doctor.json
            grep -q "\"web_source\":\"embedded\"" /tmp/doctor.json || { cat /tmp/doctor.json; exit 1; }'
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $PWD 'assets'
          $dir = Join-Path $env:RUNNER_TEMP 'bin'
          $withDesktop = Test-Path (Join-Path $assets 'folo-desktop-x86_64-pc-windows-msvc.zip')
          ./scripts/install.ps1 -BaseUrl $assets -InstallDir $dir -NoModifyPath -Desktop:$withDesktop
          if ($withDesktop -and -not (Test-Path (Join-Path $dir 'folo-desktop.exe'))) { throw 'folo-desktop.exe was not installed' }
          if ($withDesktop) {
            & (Join-Path $dir 'folo-desktop.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'folo-desktop --version failed' }
          }
          & (Join-Path $dir 'folo.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'folo --version failed' }
