name: ci
# The Rust workspace: fmt, clippy and the tests, on Linux and on Windows (the runner with a GPU, so the GPU tests run
# there). Each other part of the repo has its own workflow that runs only when its files change: web.yml (FOLO
# Studio), site.yml (the docs site), wasm.yml (the browser build), desktop.yml (FOLO Desktop). A pull request that
# touches only those parts skips this one; every push to main runs it.
on:
  pull_request:
    # Everything, minus the parts with their own workflow, plus the few files in them that a Rust test reads:
    # crates/folo-cli/tests/version.rs (the package versions) and studio_cli.rs (Studio's command-line fixtures).
    paths:
      - "**"
      - "!web/**"
      - "!site/**"
      - "!design/**"
      - "!apps/desktop/**"
      - "!docs/img/**"
      - "!.github/workflows/web.yml"
      - "!.github/workflows/site.yml"
      - "!.github/workflows/wasm.yml"
      - "!.github/workflows/desktop.yml"
      - "!.github/workflows/release.yml"
      - "!.github/workflows/runners.yml"
      - web/package.json
      - web/package-lock.json
      - web/src/lib/trainCli.fixtures.json
      - site/package.json
      - site/package-lock.json
      - apps/desktop/Cargo.toml
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
# Runners: repo variables RUNS_ON_LINUX / RUNS_ON_WINDOWS hold a JSON runs-on value. They point at FOLO's self-hosted
# runners (a boat.dev sandbox and the dev PC, see docs/CI.md); delete a variable to fall back to GitHub-hosted runners.
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runs-on: ${{ vars.RUNS_ON_LINUX || '"ubuntu-latest"' }}
          - os: windows
            runs-on: ${{ vars.RUNS_ON_WINDOWS || '"windows-latest"' }}
    name: rust (${{ matrix.os }})
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Self-hosted runners keep a persistent target dir outside the checkout (checkout cleans ignored files). It
      # only grows (every branch and profile leaves its artifacts), and a full disk fails whatever test writes next:
      # under 20 GB free, the job starts from an empty one.
      - name: persistent target dir (self-hosted, linux)
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          target="$HOME/gha/folo-target"
          free="$(df --output=avail -BG "$HOME" | tail -1 | tr -dc 0-9)"
          if [ -d "$target" ] && [ "${free:-0}" -lt 20 ]; then
            echo "::warning::${free} GB free on $(hostname): removing $target ($(du -sh "$target" | cut -f1))"
            rm -rf "$target"
          fi
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
      - name: persistent target dir (self-hosted, windows)
        if: runner.environment == 'self-hosted' && runner.os == 'Windows'
        shell: powershell
        run: Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=D:\gha\folo-target-$env:RUNNER_NAME"
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - run: cargo fmt --all -- --check
        if: matrix.os == 'linux'
      # ONNX export parity (docs/CLI.md, ONNX export): crates/folo-cli/tests/onnx.rs runs the exported graphs in
      # onnxruntime through bench/parity/onnx_check.py. The test skips without a Python; on Linux this step gives it
      # one (pinned onnx / onnxruntime / numpy) and FOLO_ONNX_REQUIRED turns a missing or broken one into a failure.
      # A self-hosted runner keeps the venv next to its target dir, one per set of pins.
      - uses: actions/setup-python@v5
        if: matrix.os == 'linux'
        with:
          python-version: "3.12"
      - name: onnx / onnxruntime / numpy (pinned)
        if: matrix.os == 'linux'
        shell: bash
        env:
          PINS: onnx==1.23.2 onnxruntime==1.31.1 numpy==2.5.4
        run: |
          venv="$RUNNER_TEMP/onnx-venv"
          if [ "${{ runner.environment }}" = self-hosted ]; then
            venv="$HOME/gha/onnx-venv-$(printf %s "$PINS" | sha256sum | cut -c1-12)"
          fi
          if ! "$venv/bin/python" -c "import onnx, onnxruntime, numpy" 2>/dev/null; then
            rm -rf "$venv"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --disable-pip-version-check $PINS
          fi
          echo "FOLO_ONNX_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"
          echo "FOLO_ONNX_REQUIRED=1" >> "$GITHUB_ENV"
      # The self-hosted Windows host (the dev PC) has an unstable CPU that occasionally crashes rustc
      # (0xc0000005 / 0xc000001d / 0xc0000409); docs/CI.md. tools/ci-retry.sh retries a step once there, and only when
      # its output shows one of those crash codes: compile errors and failing or flaky tests are never retried.
      - name: clippy
        shell: bash
        env:
          ATTEMPTS: ${{ runner.environment == 'self-hosted' && runner.os == 'Windows' && '2' || '1' }}
        run: bash tools/ci-retry.sh cargo clippy --workspace --all-targets -- -D warnings
      # tools/test-tmp.sh points FOLO_TEST_TMP and the temp dir (TMPDIR / TMP / TEMP) at a fresh folder under
      # $RUNNER_TEMP and fails the step if the tests left a `folo-*` entry there (docs/CI.md, Test temp dirs).
      - name: test
        shell: bash
        env:
          ATTEMPTS: ${{ runner.environment == 'self-hosted' && runner.os == 'Windows' && '2' || '1' }}
        run: bash tools/ci-retry.sh bash tools/test-tmp.sh cargo test --workspace
