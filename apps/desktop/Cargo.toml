# FOLO Desktop: its own cargo workspace so the root workspace and its CI stay GPUI-free.
[workspace]
resolver = "3"

[package]
name = "folo-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/himent12/folo"
description = "FOLO Desktop: the native GPUI front end for FOLO"
publish = false

[[bin]]
name = "folo-desktop"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
# The API types shared with folo-server and the CLI (root workspace, by path).
folo-api = { path = "../../crates/folo-api" }
# Local inference in Playground: folo-vision's predictor, in process, on folo-gpu or the CPU.
# Cargo.lock: gpu-allocator must use the `windows` crate wgpu-hal uses (0.62 today). Cargo may pick
# gpui's older `windows` for it (wgpu-hal's DX12 backend then fails to compile); fix the lock entry
# by hand if an update does that.
folo-core = { path = "../../crates/folo-core" }
folo-data = { path = "../../crates/folo-data" }
folo-gpu = { path = "../../crates/folo-gpu" }
folo-nn = { path = "../../crates/folo-nn" }
folo-vision = { path = "../../crates/folo-vision" }
ureq = { version = "3", features = ["json"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same major as gpui's own `image` dependency, so RenderImage frames are the same type.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Tie a spawned `folo serve` to the app's lifetime (Job Object, kill on close).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
