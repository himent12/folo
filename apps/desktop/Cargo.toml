# FOLO Desktop: its own cargo workspace so the root workspace and its CI stay GPUI-free.
[workspace]
resolver = "3"
# folo-ui (ui/): the UI framework replacing GPUI (ui/DESIGN.md).
members = [".", "ui"]

[package]
name = "folo-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/himent12/folo"
description = "FOLO Desktop: the native GPUI front end for FOLO"
publish = false

[[bin]]
name = "folo-desktop"
path = "src/main.rs"

[dependencies]
folo-ui = { path = "ui" }
# The API types shared with folo-server and the CLI (root workspace, by path).
folo-api = { path = "../../crates/folo-api" }
folo-bench = { path = "../../crates/folo-bench" }
# Local inference in Playground: folo-vision's predictor, in process, on folo-gpu or the CPU.
# Cargo.lock: gpu-allocator must use the `windows` crate wgpu-hal uses (0.62 today). Cargo may pick
# gpui's older `windows` for it (wgpu-hal's DX12 backend then fails to compile); fix the lock entry
# by hand if an update does that.
folo-core = { path = "../../crates/folo-core" }
folo-data = { path = "../../crates/folo-data" }
folo-gpu = { path = "../../crates/folo-gpu" }
folo-nn = { path = "../../crates/folo-nn" }
folo-vision = { path = "../../crates/folo-vision" }
ureq = { version = "3", features = ["json"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same major as folo-ui's own `image` dependency, so RenderImage frames are the same type.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Tie a spawned `folo serve` to the app's lifetime (Job Object, kill on close). `Win32_Security` gates
# `CreateJobObjectW` (GPUI used to turn it on for us through feature unification).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# Test temp dirs under FOLO_TEST_TMP, removed on drop (docs/CI.md, Test temp dirs).
folo-test-support = { path = "../../crates/folo-test-support" }
# The real cloud providers, which the demo's provider list must match word for word.
folo-cloud = { path = "../../crates/folo-cloud" }

[build-dependencies]
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# `release` keeps cargo's defaults (no LTO, 16 codegen units) for development (`cargo run --release`): thin LTO with
# one codegen unit over GPUI crashed rustc on a loaded 32 GB machine (docs/DOGFOOD-2.md D1). The shipped binary is
# `dist` (.github/workflows/release.yml: `cargo build --profile dist`, output in `target/dist/`).
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
