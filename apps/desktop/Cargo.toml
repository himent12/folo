# FOLO Desktop: its own cargo workspace, so the root workspace does not build the app or its UI framework.
[workspace]
resolver = "3"
# folo-ui (ui/): the app's UI framework (ui/README.md).
members = [".", "ui"]

[package]
name = "folo-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/himent12/folo"
description = "FOLO Desktop: the native front end for FOLO"
publish = false

# The app is a library (src/lib.rs) and a thin binary (src/main.rs) so cargo pipelines it: the library's front end
# starts on its dependencies' metadata, not after their code generation. The library has no doc examples and the
# binary no tests (the unit tests are the library's), so neither builds an extra test target.
[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "folo-desktop"
path = "src/main.rs"
test = false
doc = false

[features]
# Counts allocations for `--bench-frames` (folo-ui's frame bench); off in every shipped build.
bench-alloc = []
# On Windows, the Linux / macOS backend for a check on the dev machine: build with `--features winit,portable-text`
# and run with FOLO_UI_PLATFORM=winit (folo-ui's features; always on elsewhere).
winit = ["folo-ui/winit"]
portable-text = ["folo-ui/portable-text"]

[dependencies]
folo-ui = { path = "ui" }
# The API types shared with folo-server and the CLI (root workspace, by path).
folo-api = { path = "../../crates/folo-api" }
folo-bench = { path = "../../crates/folo-bench" }
# Local inference in Playground: folo-vision's predictor, in process, on folo-gpu or the CPU.
folo-core = { path = "../../crates/folo-core" }
folo-data = { path = "../../crates/folo-data" }
folo-gpu = { path = "../../crates/folo-gpu" }
folo-nn = { path = "../../crates/folo-nn" }
folo-vision = { path = "../../crates/folo-vision" }
ureq = { version = "3", features = ["json"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same major as folo-ui's own `image` dependency, so RenderImage frames are the same type.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Tie a spawned `folo serve` to the app's lifetime (Job Object, kill on close). `Win32_Security` gates
# `CreateJobObjectW`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# Test temp dirs under FOLO_TEST_TMP, removed on drop (docs/CI.md, Test temp dirs).
folo-test-support = { path = "../../crates/folo-test-support" }
# The real cloud providers, which the demo's provider list must match word for word.
folo-cloud = { path = "../../crates/folo-cloud" }

[build-dependencies]
# `preserve_order`: the themes are listed in tokens.json's order (no new crate: the app's serde_json has it already).
serde_json = { version = "1", features = ["preserve_order"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1
# File and line in backtraces, nothing for a debugger (as the root workspace): full debug info made a clean dev build
# about 40% longer and a relink of the app or a test binary about twice as long (README, Workspace, build, test).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# `release` keeps cargo's defaults (no LTO, 16 codegen units) for development (`cargo run --release`). The shipped
# binary is `dist` (.github/workflows/release.yml: `cargo build --profile dist`, output in `target/dist/`). On the dev
# PC (i7-14700KF, 32 GB), from an empty target dir: `release` about 1 min 33 s (after the library split, before the
# engine changes), a 36.4 MB exe; `dist` 3 min 39 s, 33.3 MB (before both, which shorten it too). rust-lld or link.exe
# makes no difference to either (README, Build speed).
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
