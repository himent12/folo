[build]
jobs = 8

[alias]
folo = "run --release -p folo-cli --"

# Browser builds use wasm SIMD128 (every current browser has it); the CPU GEMM has a SIMD128 micro-kernel.
# A RUSTFLAGS environment variable replaces this, so scripts/build-wasm.sh and CI pass the flag explicitly too.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
