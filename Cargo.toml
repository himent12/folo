[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/himent12/folo"
authors = ["FOLO contributors"]

[workspace.dependencies]
folo-core = { path = "crates/folo-core" }
folo-gpu = { path = "crates/folo-gpu" }
folo-nn = { path = "crates/folo-nn" }
folo-data = { path = "crates/folo-data" }
folo-vision = { path = "crates/folo-vision" }
folo-server = { path = "crates/folo-server" }
folo-mcp = { path = "crates/folo-mcp" }
folo-wasm = { path = "crates/folo-wasm" }
folo-test-support = { path = "crates/folo-test-support" }
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
crossbeam-channel = "0.5"
half = { version = "2", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
memmap2 = "0.9"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde_yaml = "0.9"
smallvec = { version = "1", features = ["union", "const_generics"] }
thiserror = "2"
walkdir = "2"
web-time = "1"
folo-api = { path = "crates/folo-api" }
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
httpdate = "1"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
http-body-util = "0.1"
sysinfo = "0.37"
clap = { version = "4", features = ["derive", "env", "string"] }
# No GL backend: FOLO targets Vulkan / DX12 / Metal natively and WebGPU in the browser.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "metal", "webgpu", "wgsl"] }
pollster = "1.0.1"
# MCP server (crates/folo-mcp): the official Rust SDK, pinned (docs/MCP.md names the protocol revisions it passes).
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2"
base64 = "0.23"
glob = "0.3"
http = "1"
# Plain-HTTP client for `folo mcp --server` (loopback `folo serve`; no TLS).
ureq = { version = "3", default-features = false }
# `folo weights pull` verifies downloads against the release's SHA256SUMS.
sha2 = "0.11"
# Test-only: validates MCP tool results against their outputSchema.
jsonschema = { version = "0.60", default-features = false }
# folo-wasm. wasm-bindgen must match the wasm-bindgen CLI exactly (scripts/build-wasm.sh checks that).
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
