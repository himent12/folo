[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/himent12/folo"
authors = ["FOLO contributors"]

[workspace.dependencies]
folo-core = { path = "crates/folo-core" }
folo-gpu = { path = "crates/folo-gpu" }
folo-nn = { path = "crates/folo-nn" }
folo-data = { path = "crates/folo-data" }
folo-vision = { path = "crates/folo-vision" }
folo-server = { path = "crates/folo-server" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
