[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/himent12/folo"
authors = ["FOLO contributors"]

[workspace.dependencies]
folo-core = { path = "crates/folo-core" }
folo-gpu = { path = "crates/folo-gpu" }
folo-nn = { path = "crates/folo-nn" }
folo-data = { path = "crates/folo-data" }
folo-vision = { path = "crates/folo-vision" }
folo-server = { path = "crates/folo-server" }
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
walkdir = "2"
folo-api = { path = "crates/folo-api" }
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
http-body-util = "0.1"
sysinfo = "0.37"
clap = { version = "4", features = ["derive", "env", "string"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
