[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/himent12/folo"
authors = ["FOLO contributors"]

[workspace.dependencies]
folo-core = { path = "crates/folo-core" }
folo-gpu = { path = "crates/folo-gpu" }
folo-nn = { path = "crates/folo-nn" }
folo-data = { path = "crates/folo-data" }
folo-vision = { path = "crates/folo-vision" }
folo-server = { path = "crates/folo-server" }
folo-mcp = { path = "crates/folo-mcp" }
folo-client = { path = "crates/folo-client" }
folo-cloud = { path = "crates/folo-cloud" }
folo-bench = { path = "crates/folo-bench" }
folo-test-support = { path = "crates/folo-test-support" }
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
crossbeam-channel = "0.5"
half = { version = "2", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
memmap2 = "0.9"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde_yaml = "0.9"
# Reading Codex's config.toml (agent labeling): the parser only.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
smallvec = { version = "1", features = ["union", "const_generics"] }
thiserror = "2"
walkdir = "2"
web-time = "1"
folo-api = { path = "crates/folo-api" }
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
httpdate = "1"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
http-body-util = "0.1"
# Only `System` (CPU, memory, OS): the other modules (disks, networks, components, users, GPUs) add Windows API
# features to build.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
clap = { version = "4", features = ["derive", "env", "string"] }
# No GL backend: FOLO targets Vulkan / DX12 / Metal natively and WebGPU in the browser.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "metal", "webgpu", "wgsl"] }
pollster = "1.0.1"
# MCP server (crates/folo-mcp): the official Rust SDK, pinned (docs/MCP.md names the protocol revisions it passes).
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2"
base64 = "0.23"
glob = "0.3"
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "http1", "server-graceful", "service"] }
# Native TLS for `folo serve --tls-cert / --tls-key` (pure Rust via ring, no OpenSSL / aws-lc-rs).
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
# Test-only: generates deterministic self-signed / CA certificates for TLS integration tests (pure Rust via ring).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
# Blocking HTTP client: folo-client (`folo mcp --server`, cloud workers) and folo-cloud (provider APIs) turn on
# `rustls` for https.
ureq = { version = "3", default-features = false }
# Cloud runs (docs/CLOUD.md): datasets travel as tar streams, worker tokens and instance nonces are random bytes.
tar = { version = "0.4", default-features = false }
getrandom = "0.3"
# `folo weights pull` verifies downloads against the release's SHA256SUMS.
sha2 = "0.11"
# Job objects, to end an agent CLI's whole process tree on Windows (crates/folo-server/src/label/tree.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
# Test-only: validates MCP tool results against their outputSchema.
jsonschema = { version = "0.60", default-features = false }
# folo-wasm. wasm-bindgen must match the wasm-bindgen CLI exactly (scripts/build-wasm.sh checks that).
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1
# File and line in backtraces, nothing for a debugger: full debug info costs build time, link time (a PDB per test
# binary on Windows) and most of a target dir's size.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# The engine crates as well: tests train and predict with them, and at opt-level 1 (no inlining across the kernels,
# no vectorised loops) those tests take several times longer than the crates take to build at 3.
[profile.dev.package.folo-core]
opt-level = 3

[profile.dev.package.folo-nn]
opt-level = 3

[profile.dev.package.folo-data]
opt-level = 3

[profile.dev.package.folo-vision]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"

# Opt-in, for iterating on the CLI or the server locally: `cargo build --profile fast -p folo-cli` (output in
# `target/fast/`). The same optimisation level as `release`, without cross-crate LTO (`lto = false` keeps only thin LTO
# inside each crate), with 16 codegen units and incremental builds. On the dev PC: 2 min 12 s from an empty target dir
# instead of 4 min 2 s, 2.7 s after an edit of folo-cli instead of 1 min 48 s, a 44 MB exe instead of 41 MB, and
# folo-n CPU forward / predict within 1.5% of `release`. Benchmarks and shipped binaries keep using `release` / `bench`.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
